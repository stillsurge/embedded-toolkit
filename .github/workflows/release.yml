name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 仓库质量门
        run: python tools/check_repo.py

      - name: 单元与集成测试
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: 打包技能
        run: |
          TAG="${GITHUB_REF_NAME}"
          zip -r "embedded-toolkit-${TAG}.zip" skills \
            -x "*/__pycache__/*" "*.pyc" "*/.pytest_cache/*"
          echo "== 包内前 15 项 =="
          unzip -l "embedded-toolkit-${TAG}.zip" | head -20
          echo "== 大小 =="
          ls -lh "embedded-toolkit-${TAG}.zip"

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" "embedded-toolkit-${TAG}.zip" \
            --title "$TAG" \
            --generate-notes
