name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出（需要完整历史，版本递增检查要跟上一个 tag 比）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装开发依赖
        run: python -m pip install -r requirements-dev.txt

      # tag 与元数据不一致就停在这里，不产出 Release。
      # 公开发布出去的包不能有"版本号对不上"这种问题，事后修只能删 Release。
      - name: 发版守卫（tag / plugin.json / CHANGELOG 三方一致）
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLUGIN=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          echo "tag=$TAG plugin=$PLUGIN"
          if [ "$TAG" != "$PLUGIN" ]; then
            echo "::error::tag v$TAG 与 .claude-plugin/plugin.json 的 $PLUGIN 不一致"
            exit 1
          fi
          if ! grep -q "^## \[$TAG\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 [$TAG] 段"
            exit 1
          fi

      - name: 发布前体检（质量门 + 测试 + 平台对齐 + 版本递增 + 隐私 + 打包预演）
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "上一个 tag：${PREV:-（无）}"
          python tools/check_release.py --since "${PREV}" --ack-pending

      - name: 打包技能
        run: |
          TAG="${GITHUB_REF_NAME}"

          # 整包：一次装全部技能
          zip -r "embedded-toolkit-${TAG}.zip" skills \
            -x "*/__pycache__/*" "*.pyc" "*/.pytest_cache/*"

          # 单技能包：只想装一个的人不用下整包
          for d in skills/*/; do
            name=$(basename "$d")
            zip -r "${name}-${TAG}.zip" "skills/${name}" \
              -x "*/__pycache__/*" "*.pyc" "*/.pytest_cache/*"
          done

          echo "== 产物 =="
          ls -lh *.zip
          echo "== 整包前 15 项 =="
          unzip -l "embedded-toolkit-${TAG}.zip" | head -20

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 幂等：tag 已存在 Release 时（重打 tag、force push、补发附件）改为覆盖上传，
          # 否则 gh release create 会因「release already exists」直接失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖上传附件"
            gh release upload "$TAG" *.zip --clobber
          else
            gh release create "$TAG" *.zip \
              --title "$TAG" \
              --generate-notes
          fi
