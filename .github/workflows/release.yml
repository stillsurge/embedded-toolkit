name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 仓库质量门
        run: python tools/check_repo.py

      - name: 单元与集成测试
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: 打包技能
        run: |
          TAG="${GITHUB_REF_NAME}"

          # 整包：一次装全部技能
          zip -r "embedded-toolkit-${TAG}.zip" skills \
            -x "*/__pycache__/*" "*.pyc" "*/.pytest_cache/*"

          # 单技能包：只想装一个的人不用下整包
          for d in skills/*/; do
            name=$(basename "$d")
            zip -r "${name}-${TAG}.zip" "skills/${name}" \
              -x "*/__pycache__/*" "*.pyc" "*/.pytest_cache/*"
          done

          echo "== 产物 =="
          ls -lh *.zip
          echo "== 整包前 15 项 =="
          unzip -l "embedded-toolkit-${TAG}.zip" | head -20

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 幂等：tag 已存在 Release 时（重打 tag、force push、补发附件）改为覆盖上传，
          # 否则 gh release create 会因「release already exists」直接失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖上传附件"
            gh release upload "$TAG" *.zip --clobber
          else
            gh release create "$TAG" *.zip \
              --title "$TAG" \
              --generate-notes
          fi
