name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
        # ubuntu-latest 已滚到 26.04，该镜像没有 Python 3.9 构建；
        # 3.9 兼容性改在 ubuntu-22.04 上验证，其余组合仍用 latest。
        include:
          - os: ubuntu-22.04
            python: "3.9"
        exclude:
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 安装开发依赖（运行时无第三方依赖）
        run: python -m pip install -r requirements-dev.txt
      - name: 仓库质量门
        run: python tools/check_repo.py
      - name: 单元与集成测试（真实厂商 SVD 测试在 CI 中跳过）
        run: python -m pytest -q
